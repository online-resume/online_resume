<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sree Pavan Teja Pothireddy</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Professional profile of Sree Pavan Teja Pothireddy">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./base.css">
  <style>
    :root {
      --bg: #070c1e;
      --bg-card: rgba(14, 22, 50, 0.7);
      --gold: #e5b842;
      --gold-light: #fbe28a;
      --gold-dark: #a37c1e;
      --gold-glow: rgba(229, 184, 66, 0.25);
      --ink: #f8fafc;
      --dim: #94a3b8;
      --line: rgba(229, 184, 66, 0.22);
      --line-strong: rgba(229, 184, 66, 0.5);
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 clamp(0.95rem, 0.92rem + 0.2vw, 1.05rem)/1.65 "Plus Jakarta Sans", sans-serif;
      overflow-x: hidden;
      position: relative;
    }
    #sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
    }
    .wrap {
      width: min(1180px, 100% - 2.5rem);
      margin-inline: auto;
      position: relative;
      z-index: 1;
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(7, 12, 30, 0.85);
      border-bottom: 1px solid var(--line);
    }
    nav .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: "Cinzel", serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      color: var(--gold-light);
      text-transform: uppercase;
    }
    .crown {
      width: 24px;
      height: 24px;
      fill: var(--gold);
      filter: drop-shadow(0 0 8px var(--gold-glow));
    }
    nav .links {
      display: flex;
      gap: 1.6rem;
    }
    nav a {
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--dim);
      transition: color 0.25s, text-shadow 0.25s;
    }
    nav a:hover {
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold-glow);
    }
    .hero {
      padding: clamp(4rem, 9vw, 8rem) 0 clamp(2rem, 5vw, 4rem);
      text-align: center;
    }
    .regal-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(229, 184, 66, 0.08);
      font-family: "Cinzel", serif;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.5rem;
      box-shadow: 0 0 20px var(--gold-glow);
    }
    h1 {
      font-family: "Cinzel", serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 1.8rem + 5vw, 6rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 25%, var(--gold-light) 60%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .lead {
      font-size: clamp(1.1rem, 1rem + 0.5vw, 1.35rem);
      color: var(--dim);
      max-width: 65ch;
      margin: 0 auto 2rem;
    }
    .hero-cta {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .btn-gold {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.8rem;
      border-radius: 8px;
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #070c1e;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(229, 184, 66, 0.4);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(229, 184, 66, 0.6);
    }
    .btn-outline {
      display: inline-flex;
      align-items: center;
      padding: 0.85rem 1.8rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(14, 22, 50, 0.5);
      color: var(--gold-light);
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: border-color 0.25s, background 0.25s;
    }
    .btn-outline:hover {
      border-color: var(--gold);
      background: rgba(229, 184, 66, 0.12);
    }
    section {
      padding: clamp(3.5rem, 6vw, 6rem) 0;
    }
    .sec-head {
      text-align: center;
      margin-bottom: 3.5rem;
      position: relative;
    }
    .sec-head::after {
      content: "";
      display: block;
      width: 70px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1rem auto 0;
    }
    .sec-head p {
      font-family: "Cinzel", serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .sec-head h2 {
      font-family: "Cinzel", serif;
      font-size: clamp(1.8rem, 1.4rem + 2vw, 3rem);
      font-weight: 800;
      color: #fff;
    }
    .royal-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: clamp(1.4rem, 2.5vw, 2.2rem);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
      position: relative;
    }
    .royal-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 16px 40px var(--gold-glow);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .stat-box {
      text-align: center;
      padding: 1.8rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(14, 22, 50, 0.5);
    }
    .stat-n {
      font-family: "Cinzel", serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 1.8rem + 2vw, 3.8rem);
      color: var(--gold-light);
      line-height: 1;
    }
    .stat-l {
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: 0.6rem;
    }
    .timeline {
      display: grid;
      gap: 2rem;
    }
    .job-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }
    .job-title {
      font-family: "Cinzel", serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-light);
    }
    .job-company {
      color: #fff;
      font-weight: 600;
    }
    .job-date {
      color: var(--gold);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .job-pts {
      margin: 1rem 0;
      display: grid;
      gap: 0.6rem;
      color: #cbd5e1;
    }
    .job-pts li {
      position: relative;
      padding-left: 1.5rem;
    }
    .job-pts li::before {
      content: "◆";
      position: absolute;
      left: 0;
      top: 0.1em;
      color: var(--gold);
      font-size: 0.75rem;
    }
    .chips-gold {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .chips-gold li, .chips-gold span {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(229, 184, 66, 0.06);
      color: var(--gold-light);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.8rem;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .foot {
      border-top: 1px solid var(--line);
      margin-top: 4rem;
      padding: 2rem 0;
      color: var(--dim);
      font-size: 0.88rem;
      text-align: center;
    }
    @media (max-width: 768px) {
      nav .links { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <canvas id="sparkles"></canvas>
  <div id="app"></div>
  <noscript><p style="padding:2rem">This royal page requires JavaScript.</p></noscript>
  <script type="module">
    import { resume as r } from "./data.js";
    import * as K from "./kit.js";

    // Animated gold sparkles canvas
    const cvs = document.getElementById("sparkles");
    const ctx = cvs.getContext("2d");
    let w, h, pts = [];
    function resize() {
      w = cvs.width = window.innerWidth;
      h = cvs.height = window.innerHeight;
      pts = Array.from({ length: 45 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -Math.random() * 0.5 - 0.2,
        a: Math.random()
      }));
    }
    resize();
    window.addEventListener("resize", resize);
    function loop() {
      ctx.clearRect(0, 0, w, h);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.y < 0) p.y = h;
        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(229, 184, 66, ${p.a * 0.6})`;
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }
    loop();

    const app = K.mount(r, `
      <nav>
        <div class="wrap">
          <div class="brand">
            <svg class="crown" viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            <span>${K.esc(r.short)} ${K.esc(r.last)}</span>
          </div>
          <div class="links">
            <a href="#about">About</a>
            <a href="#experience">Experience</a>
            <a href="#projects">Projects</a>
            <a href="#skills">Skills</a>
            <a href="#credentials">Credentials</a>
            <a href="#contact">Contact</a>
          </div>
        </div>
      </nav>

      <header class="hero wrap">
        <div class="regal-badge">Imperial Portfolio · ${K.esc(r.title)}</div>
        <h1>${K.esc(r.name)}</h1>
        <p class="lead">${K.esc(r.pitch)}</p>
        <div class="hero-cta">
          <a class="btn-gold" href="#experience">View Kingdom Works</a>
          ${K.mail(r, "btn-outline", "Royal Audience")}
        </div>
        <div class="stats-grid" data-if="stats">
          ${r.stats.map(s => `
            <div class="stat-box rv">
              <div class="stat-n">${s.pre}<span data-count="${s.n}">${s.n}</span>${K.esc(s.suf)}</div>
              <div class="stat-l">${K.esc(s.label)}</div>
            </div>`).join("")}
        </div>
      </header>

      <section class="wrap" id="about">
        <div class="sec-head"><p>Pinnacle Pedigree</p><h2>Royal Chronicle</h2></div>
        <div class="royal-card rv">
          ${K.about(r)}
          <div style="margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 1.5rem;">
            ${r.facts.map(([k, v]) => `<div><span style="color:var(--gold); font-size:0.8rem; text-transform:uppercase;">${K.esc(k)}</span>: <strong>${K.esc(v)}</strong></div>`).join("")}
          </div>
        </div>
      </section>

      <section class="wrap" id="experience">
        <div class="sec-head"><p>Distinguished Command</p><h2>Career Reign</h2></div>
        <div class="timeline">
          ${r.jobs.map(j => `
            <article class="royal-card rv">
              <div class="job-head">
                <div>
                  <div class="job-title">${K.esc(j.title || j.company)}</div>
                  <div class="job-company">${K.esc(j.company)} · ${K.esc(j.place)}</div>
                </div>
                <div class="job-date">${K.esc(j.when)}</div>
              </div>
              ${j.summary ? `<p style="color:var(--dim); font-style:italic;">${K.esc(j.summary)}</p>` : ""}
              ${j.points.length ? `<ul class="job-pts">${j.points.map(p => `<li>${K.esc(p)}</li>`).join("")}</ul>` : ""}
              ${j.tools.length ? `<ul class="chips-gold">${j.tools.map(t => `<li>${K.esc(t)}</li>`).join("")}</ul>` : ""}
            </article>`).join("")}
        </div>
      </section>

      <section class="wrap" id="projects">
        <div class="sec-head"><p>Imperial Endeavors</p><h2>Signature Deliverables</h2></div>
        <div class="grid-2">
          ${r.projects.map((p, i) => `
            <article class="royal-card rv">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:0.6rem;">
                <h3 style="font-family:'Cinzel',serif; font-size:1.25rem; color:var(--gold-light); margin:0;">${K.esc(p.name)}</h3>
                ${p.url ? `<a href="${K.esc(p.url)}" target="_blank" rel="noopener" style="color:var(--gold); font-size:0.82rem; font-weight:700; text-decoration:none; white-space:nowrap; border:1px solid var(--gold); padding:0.25rem 0.65rem; border-radius:999px;">Case Study ↗</a>` : ""}
              </div>
              ${p.about ? `<p style="color:var(--dim); margin:0.6rem 0 0.8rem; line-height:1.6;">${K.esc(p.about)}</p>` : ""}
              ${p.outcome ? `<div style="display:inline-flex; align-items:center; gap:0.4rem; padding:0.35rem 0.8rem; border-radius:6px; background:rgba(229,184,66,0.12); border:1px solid rgba(229,184,66,0.3); color:var(--gold-light); font-weight:700; font-size:0.82rem; margin-bottom:0.9rem;"><span>✦ IMPACT:</span> <span>${K.esc(p.outcome)}</span></div>` : ""}
              ${p.tools.length ? `<ul class="chips-gold" style="margin-top:0.4rem;">${p.tools.map(t => `<li>${K.esc(t)}</li>`).join("")}</ul>` : ""}
            </article>`).join("")}
        </div>
      </section>

      <section class="wrap" id="skills">
        <div class="sec-head"><p>Mastery of Guilds</p><h2>Core Proficiencies</h2></div>
        <div class="grid-3">
          ${r.skills.map(g => `
            <div class="royal-card rv">
              <h3 style="font-family:'Cinzel',serif; font-size:1.05rem; color:var(--gold-light); margin-bottom:0.9rem;">${K.esc(g.group)}</h3>
              <ul class="chips-gold">
                ${g.items.map(([name, core]) => `<li style="${core ? 'border-color:var(--gold); color:#fff; background:rgba(229,184,66,0.18);' : ''}">${K.esc(name)}</li>`).join("")}
              </ul>
            </div>`).join("")}
        </div>
      </section>

      <section class="wrap" id="credentials">
        <div class="sec-head"><p>Royal Accreditations</p><h2>Honors & Academics</h2></div>
        <div class="grid-3">
          ${r.credentials.map(c => `
            <article class="royal-card rv">
              <span style="font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--gold);">${K.esc(c.tag)}</span>
              <h3 style="margin:0.4rem 0; font-size:1.1rem; color:#fff;">${K.esc(c.name)}</h3>
              ${c.org ? `<p style="color:var(--dim); font-size:0.9rem;">${K.esc(c.org)}</p>` : ""}
              ${c.note ? `<p style="color:var(--gold-light); font-size:0.85rem; margin-top:0.4rem;">${K.esc(c.note)}</p>` : ""}
            </article>`).join("")}
        </div>
      </section>

      <section class="wrap" id="contact">
        <div class="sec-head"><p>Direct Inquiries</p><h2>Dispatch Royal Envoy</h2></div>
        <div class="grid-3">
          ${r.contacts.map(c => `
            <div class="royal-card rv" style="text-align:center;">
              <span style="font-size:0.78rem; text-transform:uppercase; letter-spacing:0.15em; color:var(--gold);">${K.esc(c.label)}</span>
              <div style="margin-top:0.6rem; font-size:1.1rem; font-weight:700;">
                ${c.href ? `<a href="${K.esc(c.href)}" style="color:#fff; text-decoration:none;">${K.esc(c.text)} ↗</a>` : `<span>${K.esc(c.text)}</span>`}
              </div>
            </div>`).join("")}
        </div>
      </section>
    `);
  </script>
</body>
</html>
